<style>
/* Matte Rainbow design system */
:root { color-scheme: dark;
  --surface-000:#0e0e10; --surface-100:#131315; --surface-200:#1c1c1f; --surface-300:#26262a; --line:#3a3a40; --line-strong:#6a6760;
  --ink:#f4f1ea; --ink-muted:#aaa69d; --ink-subtle:#7d7a73; --ink-on-color:#131315;
  --rainbow-yellow:#f2e4a8; --rainbow-green:#a0e092; --rainbow-orange:#f8aa6d; --rainbow-blue:#5bafe7; --rainbow-red:#e2767b; --rainbow-purple:#a56ec6; --rainbow-purple-ink:#c9a2f0;
  --tint-yellow:#37342d; --tint-green:#2a3429; --tint-orange:#382b23; --tint-blue:#1f2c37; --tint-red:#342325; --tint-purple:#2a2231;
  --lavender-100:#2b2639; --lavender-200:#463c63; --lavender-400:#9d8ad8; --lavender-500:#b8a6f0; --lavender-700:#d6cbfa; --accent:var(--lavender-500); --focus:var(--lavender-500); --link:var(--lavender-500);
  --radius-sm:3px; --radius-md:6px;
  --font-display:"Pixelify Sans", ui-monospace, monospace; --font-sans:"IBM Plex Sans", system-ui, sans-serif; --font-mono:"IBM Plex Mono", ui-monospace, monospace;
  /* legacy names used by the report and scripts */
  --bg:var(--surface-100); --fg:var(--ink); --mut:var(--ink-muted); --card:var(--surface-200); --pri:var(--accent); --sel:var(--lavender-100); --ok:var(--rainbow-green); --ko:var(--rainbow-red);
  --hue-a:var(--lavender-500); --tint-a:var(--lavender-100); --hue-b:var(--rainbow-purple); }
/* chromatic pair per questionnaire: lead hue + neighbour */
#app.par-lavanda { --hue-a:var(--lavender-500); --tint-a:var(--lavender-100); --hue-b:var(--rainbow-purple); }
#app.par-orchid  { --hue-a:var(--rainbow-purple); --tint-a:var(--tint-purple); --hue-b:var(--lavender-500); }
#app.par-mint    { --hue-a:var(--rainbow-green); --tint-a:var(--tint-green); --hue-b:var(--rainbow-blue); }
#app.par-sky     { --hue-a:var(--rainbow-blue); --tint-a:var(--tint-blue); --hue-b:var(--lavender-500); }
#app.par-butter  { --hue-a:var(--rainbow-yellow); --tint-a:var(--tint-yellow); --hue-b:var(--rainbow-green); }
#app.par-coral   { --hue-a:var(--rainbow-red); --tint-a:var(--tint-red); --hue-b:var(--rainbow-orange); }
* { box-sizing: border-box; }
::selection { background: var(--lavender-200); color: var(--ink); }
body { margin: 0; background: var(--surface-100); color: var(--ink); font: 17px/1.55 var(--font-sans); }
#app { max-width: 680px; margin: 0 auto; padding: 0 16px 40px; }
header { position: sticky; top: 0; background: var(--surface-100); padding: 12px 0 10px; z-index: 2; }
.banda { display:flex; flex-direction:column; margin: 0 -16px 10px; } .banda i { display:block; height:3px; }
.banda i:nth-child(1){background:var(--rainbow-yellow)} .banda i:nth-child(2){background:var(--rainbow-green)} .banda i:nth-child(3){background:var(--rainbow-orange)}
.banda i:nth-child(4){background:var(--rainbow-blue)} .banda i:nth-child(5){background:var(--rainbow-red)} .banda i:nth-child(6){background:var(--rainbow-purple)}
.barra { height: 12px; background: var(--surface-000); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.barra div { height: 100%; background: linear-gradient(to bottom, var(--rainbow-yellow) 0 16.667%, var(--rainbow-green) 16.667% 33.333%, var(--rainbow-orange) 33.333% 50%, var(--rainbow-blue) 50% 66.667%, var(--rainbow-red) 66.667% 83.333%, var(--rainbow-purple) 83.333% 100%); }
.cabtxt { font-size: 14px; margin-top: 8px; } .cabtxt b { font: 600 16px/20px var(--font-display); color: var(--hue-a); letter-spacing: .02em; margin-right: 6px; }
#app.par-orchid .cabtxt b { color: var(--rainbow-purple-ink); }
h1 { font: 700 34px/1.05 var(--font-display); margin: 18px 0 14px; } h2 { font: 600 24px/1.15 var(--font-display); margin: 18px 0 10px; } h3 { font-size: 17px; margin: 16px 0 6px; }
.mut { color: var(--ink-muted); } .small { font-size: 13px; } .ok { color: var(--rainbow-green); } .ko { color: var(--rainbow-red); }
a { color: var(--link); text-underline-offset: 3px; }
.stem { font-size: 14px; color: var(--ink-muted); margin: 16px 0 4px; }
.item { font-size: 21px; font-weight: 600; line-height: 1.35; margin: 14px 0 18px; }
.ops { display: flex; flex-direction: column; gap: 10px; padding: 4px; }
/* buttons: contrast ring = ground gap + coloured ring */
button { --ring: var(--line-strong); font: 500 16px/20px var(--font-sans); color: var(--ink); background: var(--surface-300); border: 0; border-radius: var(--radius-sm);
  padding: 11px 16px; min-height: 42px; cursor: pointer; margin: 4px; box-shadow: 0 0 0 2px var(--surface-100), 0 0 0 4px var(--ring); }
button:hover:not(:disabled):not(.sel) { --ring: var(--hue-a); background: var(--tint-a); }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 6px; }
button:disabled { color: var(--ink-subtle); background: var(--surface-200); --ring: var(--line); cursor: default; }
button.pri { color: var(--ink-on-color); background: var(--accent); font-weight: 600; --ring: var(--hue-b); }
button.pri:hover:not(:disabled) { background: var(--lavender-700); --ring: var(--hue-a); }
button.pri:disabled { color: var(--ink-subtle); background: var(--surface-200); --ring: var(--line); }
button.op { display:block; width:100%; margin:0; text-align: left; padding: 14px 16px; font-weight: 400; background: var(--surface-200); border: 1px solid var(--line-strong); border-radius: var(--radius-md); box-shadow: none; }
button.op:hover:not(:disabled) { border-color: var(--hue-a); background: var(--surface-200); }
button.op.sel { background: var(--tint-a); border: 2px solid var(--hue-a); padding: 13px 15px; font-weight: 600; box-shadow: 0 0 0 2px var(--surface-100), 0 0 0 4px var(--hue-b); }
button.sel { background: var(--tint-a); --ring: var(--hue-a); font-weight: 600; }
button.link { background: none; box-shadow: none; color: var(--link); padding: 6px 2px; min-height: 0; text-decoration: underline; text-underline-offset: 3px; }
button.link:hover:not(:disabled) { background: none; color: var(--lavender-700); }
.ayuda { display:flex; gap:10px; background: var(--tint-a); border: 1px solid var(--hue-a); border-radius: var(--radius-md); padding: 10px 12px; margin: 4px 0 12px; font-size: 15px; }
.ayuda::before { content: "?"; color: var(--hue-a); font: 700 15px/22px var(--font-mono); }
.marcas { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 16px 0 10px; font-size: 15px; }
input[type=checkbox] { width:18px; height:18px; accent-color: var(--accent); vertical-align: -3px; margin: 0 8px 0 0; }
textarea, input:not([type=checkbox]), select { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-000); color: var(--ink); }
textarea::placeholder, input::placeholder { color: var(--ink-subtle); }
textarea:hover, input:not([type=checkbox]):hover, select:hover { border-color: var(--lavender-400); }
textarea:focus, input:not([type=checkbox]):focus, select:focus { outline: none; border-color: var(--hue-a); box-shadow: 0 0 0 2px var(--surface-100), 0 0 0 4px var(--hue-b); }
.acc { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; align-items:center; } .acc .pri { margin-left: auto; }
.acc2 { margin-top: 12px; } .acc3 { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
.campo { display: block; margin: 16px 0; } .campo > span { display: block; font-size: 15px; font-weight: 500; margin-bottom: 6px; }
.esc010 { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; padding: 4px; }
.esc010 button { margin:0; padding: 9px 0; min-height: 0; font: 500 15px/20px var(--font-mono); background: var(--surface-200); border: 1px solid var(--line-strong); box-shadow: none; }
.esc010 button:hover:not(:disabled):not(.sel) { border-color: var(--hue-a); background: var(--surface-200); }

var Nucleo = (function () {
  "use strict";

  // ---------- Guardado en el registro local (servidor-local.ps1) ----------
  var local = { disponible: false, estado: "listo", pidiendo: false, msg: "", recibo: null };
  function sondearLocal() {
    if (!/^https?:$/.test(location.protocol) || !/^(127\.0\.0\.1|localhost)$/.test(location.hostname) || typeof fetch !== "function") return;
    fetch("/api/estado").then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.app === "empresaia-local") { local.disponible = true; if (PASOS[est.paso] === "resultados") render(); }
    }).catch(function () {});
  }
  function sha256Hex(s) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function (d) {
      return Array.prototype.map.call(new Uint8Array(d), function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
    });
  }
  function bloqueLocal() {

    if (!local.disponible) {

        '<div class="acc"><button data-a="local_cancelar">No, todavía no</button><button class="pri" data-a="local_guardar">Sí, guardar</button></div>';
    } else {

    if (local.recibo) h += '<p class="mut small">Recibo: <code>' + esc(local.recibo.archivo) + "</code> · " + local.recibo.bytes + " bytes · huella <code>" + esc(local.recibo.sha256.slice(0, 16)) + "…</code> · " + (local.recibo.verificado ? "verificado en disco" : "sin verificar") + (local.recibo.hoja ? " · hoja: <code>" + esc(local.recibo.hoja) + "</code>" : "") + "</p>";

  // Envío desde claude.ai (sin servidor local): el registro va a envios/<usuario> del artefacto.
  // Cada persona escribe solo el suyo; lo lee solo el responsable. Se verifica releyendo y comparando la huella.
  var ENVIO = { ref: null };
  function guardarEnvio() {
    if (local.estado === "guardando" || !ENVIO.ref) return;
    var cuerpo = datosExport(Analisis.analizar(DATOS, est));
    if (cuerpo.length > 240000) cuerpo = JSON.stringify({ formato: "empresaia-piloto-export-v1", app: VERSION, exportado: new Date().toISOString(), estado: est });
    var hashLocal = null;
    local.estado = "guardando"; local.msg = "Enviando…"; render();
    // Cada test va a su propio documento (envios/<usuario>/tests/<id>) para no sobrescribir los anteriores;
    // si las reglas no lo permitieran, se usa el documento único envios/<usuario>.
    var ref = ENVIO.db.collection("envios/" + ENVIO.uid + "/tests").doc(est.id);
    var fila;
    sha256Hex(cuerpo).then(function (h) {
      hashLocal = h;
      fila = { registro: cuerpo, sha256: h, participante: est.participante || "", id: est.id, t: Date.now(), app: VERSION };
      return ref.set(fila).catch(function () { ref = ENVIO.ref; return ref.set(fila); });
    }).then(function () { return ref.get(); }).then(function (snap) {
      var d = snap.exists ? snap.data() : null;
      return sha256Hex(d && d.registro ? d.registro : "").then(function (h2) {
        var ok = h2 === hashLocal;
        local.recibo = { archivo: "claude.ai · envío de " + (est.participante || est.id), bytes: cuerpo.length, sha256: hashLocal, verificado: ok };
        local.estado = ok ? "ok" : "error";
        local.msg = ok ? "Enviado y comprobado." : "Se envió, pero la copia no coincide. Avisa a la persona responsable.";
        est.envios.push({ t: new Date().toISOString(), destino: "claude.ai", ok: ok, sha256: hashLocal });
        log("guardado_envio", { verificado: ok }); render();
      });
    }).catch(function (e) {
      local.estado = "error"; local.msg = "No se ha podido enviar (" + (e && e.message ? e.message : "error") + "). Vuelve a intentarlo.";
      log("guardado_envio_error", { mensaje: e && e.message }); render();
    });
  }
  // Envío desde la app (Capacitor): window.IASC_DESTINO lo pone la app (app/web/destino-supabase.js).
  // La persona solo puede insertar lo suyo; el servidor calcula la huella y la app la compara con la local.
  function hayEnvio() { return local.disponible || !!ENVIO.ref || !!window.IASC_DESTINO; }
  function guardarApp() {
    if (local.estado === "guardando") return;
    var cuerpo = datosExport(Analisis.analizar(DATOS, est)), hashLocal = null;
    local.estado = "guardando"; local.msg = "Enviando…"; render();
    sha256Hex(cuerpo).then(function (h) {
      hashLocal = h;
      return window.IASC_DESTINO.enviar({ id: est.id, participante: est.participante || "", app: VERSION, registro: cuerpo, sha256: h });
    }).then(function (r) {
      var ok = !!(r && r.sha256 === hashLocal);
      local.recibo = { archivo: "envío " + (r && r.envio ? r.envio : "?"), bytes: r && r.bytes, sha256: hashLocal, verificado: ok };
      local.estado = ok ? "ok" : "error";
      local.msg = ok ? "Enviado y comprobado." : "Se envió, pero la huella del servidor no coincide. Avisa a la persona responsable.";
      est.envios.push({ t: new Date().toISOString(), destino: "app", ok: ok, envio: r && r.envio, sha256: hashLocal });
      log("guardado_envio", { destino: "app", verificado: ok }); guardar(); render();
    }).catch(function (e) {
      local.estado = "error"; local.msg = "No se ha podido enviar (" + (e && e.message ? e.message : "sin conexión") + "). Tus respuestas siguen en este móvil: vuelve a intentarlo con conexión.";
      log("guardado_envio_error", { destino: "app", mensaje: e && e.message }); render();
    });
  }
  function enviarRespuestas() { if (local.disponible) guardarLocal(); else if (window.IASC_DESTINO) guardarApp(); else guardarEnvio(); }
  function guardarLocal() {
    if (local.estado === "guardando") return;
    var cuerpo = datosExport(Analisis.analizar(DATOS, est)), hashLocal = null;
    local.estado = "guardando"; local.pidiendo = false; local.msg = "Guardando…"; render();
    sha256Hex(cuerpo).then(function (h) {
      hashLocal = h;
      return fetch("/api/guardar", { method: "POST", headers: { "Content-Type": "application/json" }, body: cuerpo });
    }).then(function (r) {
      return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error || ("HTTP " + r.status)); return j; });
    }).then(function (j) {
      return fetch("/api/verificar?archivo=" + encodeURIComponent(j.archivo)).then(function (r) { return r.json(); }).then(function (v) {
        var ok = !!(v.existe && v.sha256 === hashLocal && j.sha256 === hashLocal);
        var nb = j.nube || { activa: false };
        local.recibo = { archivo: j.archivo, bytes: j.bytes, sha256: j.sha256, verificado: ok, nube: nb };
        local.estado = ok && (!nb.activa || nb.ok) ? "ok" : "error";
        local.msg = !ok ? "Se guardó, pero la huella del archivo no coincide con la enviada. No te fíes de esta copia: descarga el JSON."
          : nb.activa && !nb.ok ? "Guardado y verificado en este equipo, pero la copia a la nube ha fallado. Revisa la carpeta de la nube."
          : "Guardado y verificado: el archivo está en datos/ y coincide con lo enviado." + (nb.activa ? " Copia en la carpeta de la nube verificada." : "");
        est.envios.push({ t: new Date().toISOString(), destino: "local", ok: ok, archivo: j.archivo, sha256: j.sha256 });
        log("guardado_local", { archivo: j.archivo, verificado: ok }); render();
        // La hoja de resultados (con colores) se guarda junto al registro
        fetch("/api/hoja?para=" + encodeURIComponent(j.archivo), { method: "POST", headers: { "Content-Type": "text/html; charset=utf-8" }, body: Hoja.documento(DATOS, Analisis.analizar(DATOS, est), est) })
          .then(function (r) { return r.json(); }).then(function (hj) { if (hj && hj.ok) { local.recibo.hoja = hj.archivo; render(); } }).catch(function () {});
      });
    }).catch(function (e) {
      local.estado = "error"; local.msg = "No se ha guardado (" + (e && e.message ? e.message : "error de red") + "). Descarga o copia los datos.";
      est.envios.push({ t: new Date().toISOString(), destino: "local", ok: false });
      log("guardado_local_error", { mensaje: e && e.message }); render();
    });
  }

    if (!DL) return;
    DL.save({ filename: nombre, data: contenido }).then(function () { log("descarga", { archivo: nombre }); envio.msg = "Descarga entregada: " + nombre; render(); },
      function (e) { envio.msg = e && e.code === "declined" ? "Descarga cancelada." : "No se pudo descargar (" + (e && e.code) + ")."; render(); });
  }

  function enviar() {
    if (!MCP || envio.estado === "enviando") return;
    if (!destinoValido()) { envio = { estado: "error", msg: "Escribe un correo de destino válido." }; render(); return; }
    var inf = Analisis.analizar(DATOS, est);
    var json = datosExport(inf), html = Analisis.informeHTML(DATOS, inf);
    var adj = [{ content: Analisis.base64utf8(json), filename: "piloto-" + nombreBase() + ".json", mimeType: "application/json" }];
    var doc = docInforme(inf);
    if (json.length + doc.length < 600000) adj.push({ content: Analisis.base64utf8(doc), filename: "informe-" + nombreBase() + ".html", mimeType: "text/html" });
    var input = { to: [destino], subject: "Piloto test · " + (est.participante || "sin código") + " · " + new Date().toLocaleString("es-ES"), body: Analisis.resumenTexto(inf), htmlBody: html, attachments: adj };
    envio = { estado: "enviando", msg: "" }; log("envio_intento", { bytes_json: json.length, adjuntos: adj.length }); render();
    MCP.callTool("Gmail", "send_message", input).then(function (r) {
      var pl = (r && r.payload) || {};
      envio = { estado: "ok", msg: "Enviado" + (pl.id ? " (id " + pl.id + ")" : "") + ". Compruébalo en tu bandeja." };
      est.envios.push({ t: new Date().toISOString(), ok: true, id: pl.id || null }); log("envio_ok", { id: pl.id || null }); render();
    }, function (e) {
      var c = e && e.code, m;
      if (c === "needs_reauth") m = "Gmail necesita volver a conectarse: claude.ai → Ajustes → Conectores. No se ha enviado.";
      else if (c === "server_not_connected" || c === "server_not_found") m = "Gmail no está conectado en tu cuenta de claude.ai (Ajustes → Conectores). No se ha enviado.";
      else if (c === "selection_required") m = "Tienes más de un conector de Gmail: elige uno cuando claude.ai lo pregunte y vuelve a pulsar.";
      else if (c === "not_in_manifest" || c === "approval_required" || c === "consent_required") m = "Hace falta tu permiso para que esta página use Gmail. Vuelve a pulsar y acepta el aviso de claude.ai.";
      else if (c === "blocked_by_policy") m = "Tu organización bloquea esta acción de Gmail.";
      else if (c === "tool_error") m = "Gmail ha rechazado el envío: " + (e.message || "sin detalle") + ".";
      else if (c === "server_unavailable" || c === "upstream_error" || c === "cancelled") m = "No hay confirmación del envío: puede haberse enviado. Mira tu bandeja antes de volver a pulsar.";
      else if (c === "not_granted" || c === "capability_disabled" || c === "capability_removed") m = "El envío no está disponible en esta vista. Usa descargar o copiar.";
      else m = "Error al enviar (" + (c || "desconocido") + "). Mira tu bandeja antes de reintentar.";
      envio = { estado: "error", msg: m };
      est.envios.push({ t: new Date().toISOString(), ok: false, codigo: c || null }); log("envio_error", { codigo: c || null, mensaje: e && e.message }); render();
    });
  }

  // ---------- Arranque ----------
  document.addEventListener("visibilitychange", function () { if (est) log(document.hidden ? "oculto" : "visible"); });
  window.addEventListener("hashchange", render);
  window.addEventListener("pagehide", function () { flushComentario(); guardar(); programarNube(true); });
  // Con el test a medias, el navegador pide confirmación antes de cerrar o recargar la página
  window.addEventListener("beforeunload", function (e) {
    if (!est || est.terminado || REV.on || itemsHechos() === 0) return;
    flushComentario(); guardar(); programarNube(true);
    e.preventDefault(); e.returnValue = "";
  });

  // Abre un estado guardado (de este dispositivo o de la cuenta) donde se quedó la persona
  function abrirEstado(e) {
    est = e;
    if (est && est.version) {
      log("reapertura", { dispositivo: dispositivo() });
      if (est.terminado) { vista = null; est.paso = PASOS.indexOf("resultados"); log("pantalla", { paso: "resultados" }); }
      else if (est.riesgo) { est.pausado = { motivo: "riesgo", t: Date.now() }; vista = "pausado"; log("pantalla", { paso: "vista:pausado", motivo: "riesgo_al_reabrir" }); }
      else if (itemsHechos() === 0) { vista = null; log("pantalla", { paso: PASOS[est.paso] || PASOS[0] }); }   // sin respuestas: sin aviso de «a medias»
      else { vista = "reanudar"; log("pantalla", { paso: "vista:reanudar" }); }
    } else {
      est = nuevoEstado();
      log("sesion_inicio", { dispositivo: dispositivo(), app: VERSION });
      log("pantalla", { paso: PASOS[0] });
    }
  }
  abrirEstado(cargar());
  conectarNube();
  if (location.hash === "#revision-ver") location.hash = "revision";
  render();

  sondearLocal();
  Hoja.init(function () { return { datos: DATOS, inf: Analisis.analizar(DATOS, est), est: est }; });
  var notaTimer = null;
  document.addEventListener("input", function (e) {
    if (!e.target || !e.target.getAttribute || !e.target.getAttribute("data-nota")) return;
    est.nota_profesional = e.target.value;
    clearTimeout(notaTimer);
    notaTimer = setTimeout(function () { log("nota_profesional", { longitud: est.nota_profesional.length }); }, 1200);
  });
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("mcp").then(function (m) { MCP = m; if (PASOS[est.paso] === "resultados") render(); }, function () {});
    window.claude.use("downloads").then(function (d) { DL = d; if (PASOS[est.paso] === "resultados") render(); }, function () {});
  }
})();

</script>
